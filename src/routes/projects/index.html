<!DOCTYPE html>
<html>

<head>
    <title>maxwellh.dev</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
</head>

<body>
    <script src="/bundle.js"></script>
    <mh-navbar></mh-navbar>
    <main>
        <h2 class="font-bold text-2xl">Projects</h2>
        <ul class="flex flex-col space-y-4 mt-5">
            <li>
                <define-project name='Apogee Estimation'
                    description='I created some simulation and filtering code for real rocket data to predict when the rocket will reach apogee before it happens. The end goal of this project is to be able to use that information to deploy airbrakes at the proper time to reach a goal apogee.'
                    tags='Python, JAX, Pandas, Matplotlib'
                    links='https://github.com/maxstrid/apogee_estimation'>
                </define-project>
            </li>
            <li>
                <define-project name='TARS'
                    description='I created code to make a real life version of TARS walk. A lot of the work on this project went into writing the CAN communication code between the ESP32 and the STM32, a lot of that code is shared because I wrote a custom protocol to split up large flatbuffers across 8 byte CAN 2.0 Packets. There is more work to do for the big version but it taught me a lot.'
                    tags='C++, ESP-IDF, PlatformIO, Flatbuffers, CAN, ESP32, STM32'
                    links='https://github.com/maxstrid/TARS'>
                </define-project>
            </li>
            <li>
                <define-project name='mvhs-master-schedule'
                    description='Me and a partner created a web application to manage and automatically generate optimized school wide schedules, and deployed onto google cloud run using docker.'
                    tags='React, Python, GCloud, Docker, Firebase'
                    links='https://mvhs-master-schedule.web.app/, https://github.com/maxstrid/mvhs-master-schedule'>
                </define-project>
            </li>
            <li>
                <define-project name='ChatFRC'
                    description='Using OpenAI and Langchain I created a chat app to help other robotics students with general questions. I was then able to deploy it to a remote server using docker compose.'
                    tags='Svelte, Sveltekit, Docker, OpenAI, Langchain'
                    links='https://chatfrc.app, https://github.com/frc971/chatfrc'>
                </define-project>
            </li>
            <li>
                <define-project name='Worktree'
                    description='Using Rust I built a tool to help manage my git worktrees, along with making the transition process easy. I also integrated it with gerrit commands in order to translate gerrit commits into a new worktree.'
                    tags='Rust, Git, Gerrit' links='https://github.com/maxstrid/worktree'>
                </define-project>
            </li>
        </ul>
    </main>

    <mh-footer></mh-footer>
</body>

</html>
